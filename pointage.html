<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFN - Pointage</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: Arial, sans-serif; background: #f5f5f5;
  }
  body { padding: 18px; display: flex; justify-content: center; min-height: 100vh; }
  .box { width: 100%; max-width: 430px; background: white; padding: 22px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); height: fit-content; }
  @media (max-width: 480px) {
    body { padding: 0; }
    .box { max-width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none; }
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: #666; margin-bottom: 20px; }
  label { display:block; margin-top: 14px; font-weight: bold; }
  input, select, textarea, button {
    width: 100%; box-sizing: border-box; padding: 13px;
    border: 1px solid #ccc; border-radius: 9px; font-size: 17px;
    margin-top: 6px; font-family: inherit;
  }
  textarea { min-height: 70px; }
  .boutons { display: flex; gap: 10px; margin-top: 22px; }
  button { color: white; border: none; font-weight: bold; margin-top: 0; }
  #btnArrivee { background: #0a7a20; }
  #btnDepart { background: #b00020; }
  button:disabled { background: #aaa; }
  .ok { color: #0a7a20; font-weight: bold; margin-top: 15px; }
  .err { color: #b00020; font-weight: bold; margin-top: 15px; }
  .small { color: #777; font-size: 13px; margin-top: 14px; }
  .encart { background: #f0f4f8; border-radius: 9px; padding: 12px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="box">
    <h1>BFN Nouvelle Aquitaine</h1>
    <div class="subtitle">Pointage arrivée / départ</div>

    <label>Site</label>
    <select id="site" required onchange="majEtatBoutons()">
      <option value="">Chargement...</option>
    </select>

    <label>Nom</label>
    <select id="nom" required onchange="majEtatBoutons()">
      <option value="">Chargement...</option>
    </select>

    <div class="encart">
      <div class="small" style="margin-top:0;">En arrivant sur le site, cliquez "J'ARRIVE". En repartant, remplissez les champs ci-dessous puis cliquez "JE PARS".</div>

      <div id="blocChambres">
        <label>Nombre de chambres (obligatoire pour partir)</label>
        <input id="chambres" type="number" min="0" step="1" oninput="majEtatBoutons()">
      </div>

      <label>Observation facultative (à remplir en partant)</label>
      <textarea id="observation" placeholder="Ex : manque de linge, problème chambre, retard..."></textarea>
    </div>

    <div class="boutons">
      <button id="btnArrivee" onclick="envoyer('arrivee')" disabled>☀️ J'ARRIVE</button>
      <button id="btnDepart" onclick="envoyer('depart')" disabled>🌙 JE PARS</button>
    </div>

    <div id="message"></div>
    <div class="small">Les heures sont enregistrées automatiquement au moment du clic.</div>
  </div>

  <script>
    // Collez ici le lien de votre déploiement Apps Script (Déployer > Gérer les déploiements).
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuvcPjt49OpNI7xy4Lv_MbSWPB7DvUIOGS8Mztz1Yy8QoorVzZoy4SJQkgbUpH4R3z/exec";

    let sitesData = [];
    let donneesChargees = false;

    function siteEstHotel_() {
      const select = document.getElementById("site");
      const site = sitesData.find(function(s) { return s.nom === select.value; });
      return site ? site.type === "Hôtel" : false;
    }

    function majAffichageChambres() {
      const bloc = document.getElementById("blocChambres");
      if (siteEstHotel_()) {
        bloc.style.display = "";
      } else {
        bloc.style.display = "none";
        document.getElementById("chambres").value = "";
      }
    }

    function majEtatBoutons() {
      majAffichageChambres();
      const site = document.getElementById("site").value;
      const nom = document.getElementById("nom").value;
      const chambres = document.getElementById("chambres").value;
      const identifieOk = donneesChargees && !!(site && nom);

      document.getElementById("btnArrivee").disabled = !identifieOk;
      // Le départ reste indisponible tant que le nombre de chambres n'est pas rempli (sites hôtel).
      const chambresOk = !siteEstHotel_() || (chambres !== "" && Number(chambres) >= 0);
      document.getElementById("btnDepart").disabled = !identifieOk || !chambresOk;
    }

    function remplirSelect(id, options, texteVide) {
      const select = document.getElementById(id);
      select.innerHTML = "";
      const optVide = document.createElement("option");
      optVide.value = ""; optVide.textContent = texteVide;
      select.appendChild(optVide);
      options.forEach(function(o) {
        const opt = document.createElement("option");
        opt.value = o.value; opt.textContent = o.label;
        select.appendChild(opt);
      });
    }

    function chargerDonnees() {
      const msg = document.getElementById("message");
      fetch(SCRIPT_URL + "?format=json")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          sitesData = data.sites || [];
          remplirSelect("site", sitesData.map(function(s) { return { value: s.nom, label: s.nom }; }), "Sélectionner");
          remplirSelect("nom", (data.salaries || []).map(function(n) { return { value: n, label: n }; }), "Sélectionner");
          donneesChargees = true;
          majEtatBoutons();
        })
        .catch(function(err) {
          msg.className = "err";
          msg.textContent = "Impossible de charger la liste des sites/salariés. Vérifiez votre connexion et réessayez.";
        });
    }

    function envoyer(action) {
      const btnArrivee = document.getElementById("btnArrivee");
      const btnDepart = document.getElementById("btnDepart");
      const msg = document.getElementById("message");
      msg.innerHTML = "";

      const site = document.getElementById("site").value;
      const nom = document.getElementById("nom").value;
      if (!site || !nom) {
        msg.className = "err";
        msg.textContent = "Merci de sélectionner votre site et votre nom.";
        return;
      }

      btnArrivee.disabled = true;
      btnDepart.disabled = true;

      const data = {
        action: action,
        site: site,
        nom: nom,
        chambres: document.getElementById("chambres").value,
        observation: document.getElementById("observation").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: new URLSearchParams(data).toString()
      })
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res.ok) {
            msg.className = "ok";
            msg.textContent = res.message;
            document.getElementById("chambres").value = "";
            document.getElementById("observation").value = "";
          } else {
            msg.className = "err";
            msg.textContent = res.message || "Erreur lors de l'envoi.";
          }
          majEtatBoutons();
        })
        .catch(function(err) {
          msg.className = "err";
          msg.textContent = "Erreur réseau lors de l'envoi. Réessayez.";
          majEtatBoutons();
        });
    }

    chargerDonnees();
  </script>
</body>
</html>
